<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'ru' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/pink.css' | relative_url }}">
  </head>
  <body class="pink-page">
    <div class="page-shell">
      <header class="hero">
        <p class="eyebrow">Custom GitHub Pages theme</p>
        <h1>{{ page.title | default: site.title }}</h1>
        <p class="subtitle">{{ page.description | default: site.description }}</p>
        <nav class="hero-nav" aria-label="Page versions">
          <a href="{{ '/' | relative_url }}">Базовая версия</a>
          <a href="mailto:pinkman@gmx.com">pinkman@gmx.com</a>
          <a href="http://www.pinkpaper.org">pinkpaper.org</a>
        </nav>
      </header>

      <main class="content">
        {{ content }}
      </main>
    </div>
  </body>
</html>
